[package]
name = "kodrat_mm_bot"
version = "0.1.0"
edition = "2021"
description = "Reference market-making bot for Kodrat option RFQ"

[[bin]]
name = "kodrat-mm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "2"
solana-rpc-client = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
